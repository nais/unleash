# Default values for unleash-releasechannel
# This chart creates ReleaseChannel resources for each Unleash major version

# Namespace where Unleash instances are deployed (set by Fasit)
namespace: ""

# Image registry configuration (shared across all versions)
image:
  registry: europe-north1-docker.pkg.dev
  repository: nais-io/nais/images/nais-unleash
# Compatible Unleasherator CRDs and controllers are deployed in all environments.
unleasheratorBreakGlassSupported: true

# ReleaseChannel versions - each entry creates a ReleaseChannel resource
# Tags are automatically updated during CI/CD from git tags
versions:
  v6:
    enabled: true
    # Image tag for this version (format: v6-6.10.1-sha, retrieved from git tags)
    tag: v6-6.10.1
    strategy: {}
    healthChecks: {}
    # Empty keeps the default derived timeout. Set a Go duration only for an
    # explicit operational override.
    maxUpgradeTime: ""
    # Must equal tag. Fasit confirmation and audit control this emergency path.
    breakGlassTargetTag: ""
    allowDowngrade: false
  v7:
    enabled: true
    # Image tag for this version (format: v7-7.1.0-sha, retrieved from git tags)
    tag: v7-7.1.0
    strategy: {}
    healthChecks: {}
    maxUpgradeTime: ""
    breakGlassTargetTag: ""
    allowDowngrade: false

# Shared deployment strategy configuration
strategy:
  # Maximum number of instances to deploy in parallel
  maxParallel: 1
  # Batch interval between deployments (Go duration format)
  batchInterval: "30s"
  # Canary deployment configuration
  canary:
    enabled: false
    # labelSelector:
    #   matchLabels:
    #     deployment: canary

# Health check configuration
healthChecks:
  # Enable health checks after deployment
  enabled: true
  # Initial delay before health checks start
  initialDelay: "30s"
  # Timeout for health checks
  timeout: "5m"

# Rollback configuration
rollback:
  # Enable automatic rollback on failure
  enabled: false
  # Rollback on deployment failure
  onFailure: true
