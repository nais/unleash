name: Helm Chart

on:
  # Trigger after container images are built
  workflow_run:
    workflows: ["Main"]
    branches:
      - '**'
    types:
      - completed
  # Allow manual chart builds/re-runs
  workflow_dispatch:
  # Also allow manual chart updates
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yaml'
  push:
    branches:
      - '**'
      - '!main'
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  HELM_VERSION: v3.19.4
  ARTIFACT_REGISTRY: europe-north1-docker.pkg.dev
  ARTIFACT_REPO: nais-io/nais/feature
  SERVICE_ACCOUNT: gh-unleash@nais-io.iam.gserviceaccount.com
  CHART_NAME: unleash-releasechannel

jobs:
  meta:
    name: Metadata
    runs-on: ubuntu-latest
    # Never build metadata for workflow_run events triggered from forks.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      versions_json: ${{ steps.versions.outputs.json }}
      production_release: ${{ steps.ctx.outputs.production_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Fetch published image tags
        run: git fetch --force --tags origin

      - name: Resolve branch and sha
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # The ref that triggered this run differs per event type:
          #  - workflow_run: the branch/sha of the Main workflow that triggered us
          #  - push/workflow_dispatch/pull_request: the current checkout
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            branch="$WR_HEAD_BRANCH"
            sha_short=$(echo "$WR_HEAD_SHA" | cut -c1-7)
          else
            branch="${GITHUB_REF_NAME}"
            sha_short=$(git rev-parse --short HEAD)
          fi
          branch_slug=$(echo "${branch}" | tr '/' '-')
          production_release=false
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$WR_EVENT" = "push" ] && [ "$WR_HEAD_BRANCH" = "main" ] && [ "$WR_CONCLUSION" = "success" ]; then
            current_main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$WR_HEAD_SHA" = "$current_main_sha" ]; then
              production_release=true
            else
              echo "Skipping stale Main workflow for ${WR_HEAD_SHA}; main is ${current_main_sha}"
            fi
          fi
          # Tag suffix matches Main workflow: plain sha on main, branch-qualified otherwise
          if [ "${branch}" = "main" ]; then
            suffix="${sha_short}"
          else
            suffix="${branch_slug}-${sha_short}"
          fi
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
          # Helm chart versions must be SemVer-valid, and SemVer forbids '_'
          # (e.g. a branch like 'nais_api_sa'). Derive a SemVer-safe slug that
          # also turns '_' into '.'. Docker tags allow '_', so the image tag
          # keeps the plain branch_slug above; only the chart version uses this.
          semver_slug=$(echo "${branch_slug}" | tr '_' '.')
          if [ "${branch}" = "main" ]; then
            chart_suffix="${sha_short}"
          else
            chart_suffix="${semver_slug}-${sha_short}"
          fi
          {
            echo "branch=${branch}"
            echo "branch_slug=${branch_slug}"
            echo "sha_short=${sha_short}"
            echo "production_release=${production_release}"
            echo "suffix=${suffix}"
            echo "chart_suffix=${chart_suffix}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate version
        id: version
        env:
          CHART_SUFFIX: ${{ steps.ctx.outputs.chart_suffix }}
        run: |
          # Branch chart versions get a SemVer-safe branch suffix so they never
          # overwrite a same-day main chart in the OCI registry.
          version="$(date +'%Y%m%d')-${CHART_SUFFIX}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Detect Unleash versions and build version map
        id: versions
        env:
          SUFFIX: ${{ steps.ctx.outputs.suffix }}
          PRODUCTION_RELEASE: ${{ steps.ctx.outputs.production_release }}
        run: |
          # Production chart deployment follows a successful Main push that has
          # built and tagged both images. All other chart builds use a
          # deterministic tag and are never deployed to Fasit.
          suffix="$SUFFIX"
          production_release="$PRODUCTION_RELEASE"
          versions_json="{"
          first=true
          for dir in packages/unleash-v*; do
            version_suffix=$(basename "$dir" | sed 's/unleash-//')
            unleash_version=$(jq -r '.dependencies["unleash-server"]' "$dir/package.json")

            tag="${version_suffix}-${unleash_version}-${suffix}"
            if [ "$production_release" = "true" ]; then
              if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
                echo "Expected published image tag ${tag} is missing" >&2
                exit 1
              fi
            fi
            echo "Resolved tag: ${tag} for ${version_suffix}"

            if [ "$first" = true ]; then
              first=false
            else
              versions_json+=","
            fi
            versions_json+="\"${version_suffix}\":{\"tag\":\"${tag}\"}"
          done
          versions_json+="}"
          echo "json=${versions_json}" >> "$GITHUB_OUTPUT"
          echo "Detected versions: ${versions_json}"

      - name: Update Chart.yaml version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*$/version: ${VERSION}/g" ./charts/${{ env.CHART_NAME }}/Chart.yaml
          cat ./charts/${{ env.CHART_NAME }}/Chart.yaml

      - name: Update values.yaml with image tags
        env:
          VERSIONS_JSON: ${{ steps.versions.outputs.json }}
        run: |
          # Parse the versions JSON and update each tag in values.yaml
          versions="$VERSIONS_JSON"
          for version in $(echo "$versions" | jq -r 'keys[]'); do
            tag=$(echo "$versions" | jq -r ".${version}.tag")
            # Update the tag for this version in values.yaml
            sed -i "/^  ${version}:/,/^  v[0-9]/ s/tag:.*$/tag: ${tag}/" ./charts/${{ env.CHART_NAME }}/values.yaml
          done
          cat ./charts/${{ env.CHART_NAME }}/values.yaml

      - name: Save Chart Metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: chart-metadata
          path: |
            ./charts/${{ env.CHART_NAME }}/Chart.yaml
            ./charts/${{ env.CHART_NAME }}/values.yaml

  lint-test:
    name: Lint and test Chart
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Restore Chart Metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: chart-metadata
          path: ./charts/${{ env.CHART_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # ratchet:azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # ratchet:helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (lint)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --charts "./charts/${CHART_NAME}" --target-branch "$DEFAULT_BRANCH"

  push:
    name: Build and push Chart
    runs-on: ubuntu-latest
    needs: [meta, lint-test]
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Restore Chart Metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: chart-metadata
          path: ./charts/${{ env.CHART_NAME }}

      - name: Authenticate to Google Cloud
        id: auth
        if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3

      - name: Log in to Google Artifact Registry
        if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://${{ env.ARTIFACT_REGISTRY }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # ratchet:azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build Chart
        run: |
          helm package ./charts/${{ env.CHART_NAME }} -d ./charts/${{ env.CHART_NAME }}

      - name: Push Chart
        if: github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        run: |
          helm push ./charts/${{ env.CHART_NAME }}/*.tgz oci://${{ env.ARTIFACT_REGISTRY }}/${{ env.ARTIFACT_REPO }}

  deploy:
    name: Deploy to Fasit
    runs-on: fasit-deploy
    needs: [meta, push]
    # Deploy only after a successful Main push has published the exact images
    # represented by chart metadata. Branch and pull-request charts never
    # touch Fasit.
    if: github.event_name == 'workflow_run' && needs.meta.outputs.production_release == 'true'
    permissions:
      id-token: write
    steps:
      - name: Deploy ${{ env.CHART_NAME }}
        uses: nais/fasit-deploy@53e433b1bdd08fc622e03a78584c0832c9083bd3 # ratchet:nais/fasit-deploy@v4.1.1
        with:
          chart: oci://${{ env.ARTIFACT_REGISTRY }}/${{ env.ARTIFACT_REPO }}/${{ env.CHART_NAME }}
          version: ${{ needs.meta.outputs.version }}
          targets: |
            [
              { "target": { "kind": "management", "tenant": "ci-nais" }, "wait": true },
              { "target": { "kind": "management", "tenant": "dev-nais" } },
              { "target": { "kind": "management", "tenant": "atil" } },
              { "target": { "kind": "management", "tenant": "nav" } }
            ]

  git-tag:
    runs-on: ubuntu-latest
    needs: [meta, deploy]
    if: github.event_name == 'workflow_run' && needs.meta.outputs.production_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: git tag and push
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          tag="chart-${CHART_NAME}-${VERSION}"
          git tag "${tag}" || true
          git push origin "${tag}" || true

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [meta, push, deploy, git-tag]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Generate Summary
        env:
          VERSIONS_JSON: ${{ needs.meta.outputs.versions_json }}
          VERSION: ${{ needs.meta.outputs.version }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          versions="$VERSIONS_JSON"

          echo "# 🚀 Helm Chart Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Chart Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Chart Name** | \`${{ env.CHART_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Chart Version** | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`${{ env.ARTIFACT_REGISTRY }}/${{ env.ARTIFACT_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git Tag** | \`chart-${CHART_NAME}-${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ReleaseChannel Versions" >> $GITHUB_STEP_SUMMARY
          echo "| Version | Image Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|" >> $GITHUB_STEP_SUMMARY
          for version in $(echo "$versions" | jq -r 'keys[]' | sort); do
            tag=$(echo "$versions" | jq -r ".${version}.tag")
            echo "| **${version}** | \`${tag}\` |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Metadata | ${{ needs.meta.result == 'success' && '✅ Success' || needs.meta.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Push Chart | ${{ needs.push.result == 'success' && '✅ Success' || needs.push.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Fasit | ${{ needs.deploy.result == 'success' && '✅ Success' || needs.deploy.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Tag | ${{ needs.git-tag.result == 'success' && '✅ Success' || needs.git-tag.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Trigger Information" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${REF}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | @${ACTOR} |" >> $GITHUB_STEP_SUMMARY
