version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    # Note: Do not update to node:25 - distroless only supports nodejs24
    # See: https://github.com/GoogleContainerTools/distroless
    ignore:
      - dependency-name: "node"
        versions: [">=25"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    groups:
      actions:
        patterns:
          - "*"

  # Root package.json (shared devDependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    # Note: @types/node major version must match Node.js major version
    # Do not update to @types/node@25 until distroless supports nodejs25
    #
    # Note: typescript-eslint has no TypeScript 7 support. Keep TypeScript 6
    # eligible while blocking unsupported TypeScript 7 releases.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "vite"
        versions: [">=8"]
      - dependency-name: "vitest"
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]
    groups:
      npm-root:
        patterns:
          - "*"

  # Shared package - no unleash-server updates (peer dependency)
  - package-ecosystem: "npm"
    directory: "/packages/shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "unleash-server"
    groups:
      npm-shared:
        patterns:
          - "*"

  # Unleash v6 - only allow 6.x updates
  - package-ecosystem: "npm"
    directory: "/packages/unleash-v6"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    groups:
      npm-v6:
        patterns:
          - "*"
        exclude-patterns:
          - "unleash-server"
    # Allow patch/minor updates within 6.x only
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "unleash-server"
        update-types: ["version-update:semver-major"]

  # Unleash v7 - only allow 7.x updates
  - package-ecosystem: "npm"
    directory: "/packages/unleash-v7"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    groups:
      npm-v7:
        patterns:
          - "*"
        exclude-patterns:
          - "unleash-server"
    # Allow patch/minor updates within 7.x only
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "unleash-server"
        update-types: ["version-update:semver-major"]
